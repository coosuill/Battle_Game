name: Adjust powerup odds

on:
  push:
    paths:
      - '.github/workflows/powerup-odds.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust normal pickup odds
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '  if(r < 0.97) return "banana";\n  return "bazooka";'
          new = '  if(r < 0.93) return "banana";\n  return "bazooka";'
          if old not in s:
              raise SystemExit('Expected normal pickup thresholds not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          sed -n '/<script>/,/<\/script>/p' index.html | sed '1d;$d' > /tmp/battle.js
          node --check /tmp/battle.js
      - name: Commit and clean helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/powerup-odds.yml
          git add index.html .github/workflows/powerup-odds.yml
          git commit -m "Set banana to 15 percent and bazooka to 7 percent"
          git push
