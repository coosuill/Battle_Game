name: Compact battle UI and power key

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI and bazooka updates
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          def rep(old, new, n=1):
              global s
              if old not in s:
                  raise SystemExit('Expected block not found: ' + old[:100].replace('\n',' | '))
              s = s.replace(old, new, n)

          rep('width:min(34%,420px);max-height:82%;padding:10px 12px;border-radius:12px;',
              'width:min(28%,350px);max-height:82%;padding:8px 9px;border-radius:12px;')
          rep('.overlay-title{text-align:center;color:var(--gold);font-size:13px;font-weight:bold;margin-bottom:6px}',
              '.overlay-title{text-align:center;color:var(--gold);font-size:12px;font-weight:bold;margin-bottom:4px}\n.power-key{font-size:9px;line-height:1.25;text-align:center;color:#dce8df;background:rgba(255,255,255,.05);border-radius:7px;padding:4px 5px;margin-bottom:5px;white-space:normal}')
          rep('minmax(88px,1fr)', 'minmax(62px,1fr)')

          rep('''  padding:16px 16px 76px;
  text-align:center;
  overflow:visible;
  margin:auto 0;''', '''  padding:7px 10px 12px;
  text-align:center;
  overflow:visible;
  margin:0;''')
          rep('''  width:78px;height:78px;border-radius:50%;object-fit:cover;
  border:4px solid var(--gold);margin:6px auto 10px;display:block''', '''  width:48px;height:48px;border-radius:50%;object-fit:cover;
  border:3px solid var(--gold);margin:0 auto 3px;display:block''')
          rep('.report-wrap{overflow-x:auto;margin-top:12px}', '.report-wrap{overflow-x:auto;margin-top:3px}')
          rep('''  font-size:12px;
  text-align:left;''', '''  font-size:10px;
  text-align:left;''')
          rep('''  padding:7px 8px;
  white-space:nowrap;''', '''  padding:3px 4px;
  white-space:nowrap;''')
          rep('''  font-size:11px;
  text-transform:uppercase;''', '''  font-size:9px;
  text-transform:uppercase;''')
          rep('  width:28px;height:28px;margin:0;border:2px solid rgba(255,255,255,.65)',
              '  width:20px;height:20px;margin:0;border:1px solid rgba(255,255,255,.65)')
          rep('''  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:8px;
  margin-top:10px;''', '''  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:3px;
  margin-top:3px;''')
          rep('''  border-radius:9px;
  padding:8px;''', '''  border-radius:7px;
  padding:3px 4px;
  font-size:9px;''')
          rep('.report-stat strong{display:block;color:var(--gold);font-size:18px}',
              '.report-stat strong{display:block;color:var(--gold);font-size:12px;line-height:1.1}')
          rep('''  margin:14px 0 4px;
  text-align:left;''', '''  margin:5px 0 2px;
  text-align:left;
  font-size:10px;''')

          rep('''    if(rb < 0.36) return "speed";
    if(rb < 0.69) return "shield";
    if(rb < 0.93) return "burst";
    if(rb < 0.98) return "banana";
    return "bazooka";''', '''    if(rb < 0.34) return "speed";
    if(rb < 0.65) return "shield";
    if(rb < 0.88) return "burst";
    if(rb < 0.92) return "banana";
    return "bazooka";''')
          rep('''  if(r < 0.33) return "health";
  if(r < 0.52) return "speed";
  if(r < 0.69) return "shield";
  if(r < 0.85) return "burst";
  if(r < 0.98) return "banana";
  return "bazooka";''', '''  if(r < 0.31) return "health";
  if(r < 0.48) return "speed";
  if(r < 0.63) return "shield";
  if(r < 0.78) return "burst";
  if(r < 0.92) return "banana";
  return "bazooka";''')

          rep("  overlayEl.innerHTML = '<div class=\"overlay-title\">'+title+'</div><div class=\"overlay-grid\">'+sections.join('')+'</div>';",
              "  var powerKey = '<div class=\"power-key\"><strong>Power-ups:</strong> + Health · » Speed · S Shield · B Burst · R Bazooka · ! Banana</div>';\n  overlayEl.innerHTML = '<div class=\"overlay-title\">'+title+'</div>'+powerKey+'<div class=\"overlay-grid\">'+sections.join('')+'</div>';" )

          rep('''  eliminationTableEl.innerHTML =
    '<div class="report-subtitle">Elimination Log</div>' +
    '<div class="report-wrap"><table class="report-table">' +
      '<thead><tr><th>#</th><th>Time</th><th>Eliminated</th><th>By</th><th>Final Place</th></tr></thead>' +
      '<tbody>' + eliminationRows + '</tbody></table></div>';''', "  eliminationTableEl.innerHTML = '';" )

          marker = '.team-champion-faces.show{display:flex}'
          extra = '''
.celebrate-card #celeLabel{font-size:10px;line-height:1;margin:0 0 2px}
.celebrate-card #celeWinner{font-size:16px!important;line-height:1.1;margin:0 0 3px!important}
.team-champion-faces{gap:5px!important;margin:2px auto 4px!important}
.team-champion-person{min-width:52px!important;gap:2px!important}
.team-champion-person img{width:42px!important;height:42px!important;border-width:2px!important}
.team-champion-person span{font-size:9px!important;max-width:66px!important}
'''
          rep(marker, marker + extra)

          # Mobile/Silk: keep the overlay narrower rather than forcing full width.
          rep('.overlay{right:8px;top:auto;bottom:48px;transform:none;width:calc(100% - 16px);max-height:34%;padding:8px}',
              '.overlay{right:8px;top:auto;bottom:48px;transform:none;width:min(88%,350px);max-height:40%;padding:7px}')

          p.write_text(s)
          for wf in [Path('.github/workflows/final-duel.yml'), Path('.github/workflows/compact-ui-power-key.yml')]:
              if wf.exists(): wf.unlink()
          PY
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/battle.js').write_text(js)
          PY
          node --check /tmp/battle.js
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows
          git commit -m "Increase bazooka rate and compact battle UI"
          git push
