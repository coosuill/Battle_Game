name: Compact battle UI and power key

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI and bazooka updates
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          replacements = [
            ('width:min(34%,420px);max-height:82%;padding:10px 12px;border-radius:12px;',
             'width:min(28%,350px);max-height:82%;padding:8px 9px;border-radius:12px;'),
            ('.overlay-title{text-align:center;color:var(--gold);font-size:13px;font-weight:bold;margin-bottom:6px}',
             '.overlay-title{text-align:center;color:var(--gold);font-size:12px;font-weight:bold;margin-bottom:4px}\\n.power-key{font-size:9px;line-height:1.25;text-align:center;color:#dce8df;background:rgba(255,255,255,.05);border-radius:7px;padding:4px 5px;margin-bottom:5px;white-space:normal}'),
            ('minmax(88px,1fr)', 'minmax(62px,1fr)'),
            ('  padding:16px 16px 76px;\\n  text-align:center;\\n  overflow:visible;\\n  margin:auto 0;',
             '  padding:7px 10px 12px;\\n  text-align:center;\\n  overflow:visible;\\n  margin:0;'),
            ('  width:78px;height:78px;border-radius:50%;object-fit:cover;\\n  border:4px solid var(--gold);margin:6px auto 10px;display:block',
             '  width:48px;height:48px;border-radius:50%;object-fit:cover;\\n  border:3px solid var(--gold);margin:0 auto 3px;display:block'),
            ('.report-wrap{overflow-x:auto;margin-top:12px}', '.report-wrap{overflow-x:auto;margin-top:3px}'),
            ('  font-size:12px;\\n  text-align:left;', '  font-size:10px;\\n  text-align:left;'),
            ('  padding:7px 8px;\\n  white-space:nowrap;', '  padding:3px 4px;\\n  white-space:nowrap;'),
            ('  font-size:11px;\\n  text-transform:uppercase;', '  font-size:9px;\\n  text-transform:uppercase;'),
            ('  width:28px;height:28px;margin:0;border:2px solid rgba(255,255,255,.65)',
             '  width:20px;height:20px;margin:0;border:1px solid rgba(255,255,255,.65)'),
            ('  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));\\n  gap:8px;\\n  margin-top:10px;',
             '  grid-template-columns:repeat(3,minmax(0,1fr));\\n  gap:3px;\\n  margin-top:3px;'),
            ('  border-radius:9px;\\n  padding:8px;', '  border-radius:7px;\\n  padding:3px 4px;\\n  font-size:9px;'),
            ('.report-stat strong{display:block;color:var(--gold);font-size:18px}',
             '.report-stat strong{display:block;color:var(--gold);font-size:12px;line-height:1.1}'),
            ('  margin:14px 0 4px;\\n  text-align:left;', '  margin:5px 0 2px;\\n  text-align:left;\\n  font-size:10px;'),
            ('    if(rb < 0.36) return "speed";\\n    if(rb < 0.69) return "shield";\\n    if(rb < 0.93) return "burst";\\n    if(rb < 0.98) return "banana";\\n    return "bazooka";',
             '    if(rb < 0.34) return "speed";\\n    if(rb < 0.65) return "shield";\\n    if(rb < 0.88) return "burst";\\n    if(rb < 0.92) return "banana";\\n    return "bazooka";'),
            ('  if(r < 0.33) return "health";\\n  if(r < 0.52) return "speed";\\n  if(r < 0.69) return "shield";\\n  if(r < 0.85) return "burst";\\n  if(r < 0.98) return "banana";\\n  return "bazooka";',
             '  if(r < 0.31) return "health";\\n  if(r < 0.48) return "speed";\\n  if(r < 0.63) return "shield";\\n  if(r < 0.78) return "burst";\\n  if(r < 0.92) return "banana";\\n  return "bazooka";'),
            ('  overlayEl.innerHTML = \'<div class="overlay-title">\'+title+\'</div><div class="overlay-grid">\'+sections.join(\'\')+\'</div>\';',
             '  var powerKey = \'<div class="power-key"><strong>Power-ups:</strong> + Health · » Speed · S Shield · B Burst · R Bazooka · ! Banana</div>\';\\n  overlayEl.innerHTML = \'<div class="overlay-title">\'+title+\'</div>\'+powerKey+\'<div class="overlay-grid">\'+sections.join(\'\')+\'</div>\';'),
            ('  eliminationTableEl.innerHTML =\\n    \'<div class="report-subtitle">Elimination Log</div>\' +\\n    \'<div class="report-wrap"><table class="report-table">\' +\\n      \'<thead><tr><th>#</th><th>Time</th><th>Eliminated</th><th>By</th><th>Final Place</th></tr></thead>\' +\\n      \'<tbody>\' + eliminationRows + \'</tbody></table></div>\';',
             '  eliminationTableEl.innerHTML = \'\';')
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Expected block not found: ' + old[:90])
              s = s.replace(old, new, 1)

          # Extra compacting for the celebration heading and team champion faces.
          marker = '.team-champion-faces.show{display:flex}'
          extra = '''\\n.celebrate-card #celeLabel{font-size:10px;line-height:1;margin:0 0 2px}\\n.celebrate-card #celeWinner{font-size:16px!important;line-height:1.1;margin:0 0 3px!important}\\n.team-champion-faces{gap:5px!important;margin:2px auto 4px!important}\\n.team-champion-person{min-width:52px!important;gap:2px!important}\\n.team-champion-person img{width:42px!important;height:42px!important;border-width:2px!important}\\n.team-champion-person span{font-size:9px!important;max-width:66px!important}\\n'''
          if extra.strip() not in s:
              s = s.replace(marker, marker + extra, 1)

          # Clean up obsolete patch workflow that was causing a failed run on later pushes.
          old_workflow = Path('.github/workflows/final-duel.yml')
          if old_workflow.exists():
              old_workflow.unlink()
          Path('.github/workflows/compact-ui-power-key.yml').unlink()
          p.write_text(s)
          PY
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/battle.js').write_text(js)
          PY
          node --check /tmp/battle.js
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows
          git commit -m "Increase bazooka rate and compact battle UI"
          git push
