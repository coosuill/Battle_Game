name: Apply live leader energy fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rank live fighters by energy first
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = """      if(a.eliminations !== b.eliminations) return b.eliminations - a.eliminations;\n      return b.hp - a.hp;"""
          new = """      if(a.hp !== b.hp) return b.hp - a.hp;\n      return b.eliminations - a.eliminations;"""
          if old not in s:
              raise SystemExit('Expected live leaderboard sort lines not found')
          p.write_text(s.replace(old, new, 1))
          Path('.github/workflows/leader-energy-fix.yml').unlink()
          trigger = Path('.leader-fix-trigger')
          if trigger.exists(): trigger.unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rank live battle leader by energy"
          git push
