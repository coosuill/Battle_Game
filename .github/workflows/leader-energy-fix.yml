name: Apply live leader energy fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rank live fighters by energy first
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''  return battleState.fighters.slice().sort(function(a,b){
            if(a.alive !== b.alive) return a.alive ? -1 : 1;
            if(a.alive && b.alive) {
              if(a.eliminations !== b.eliminations) return b.eliminations - a.eliminations;
              return b.hp - a.hp;
            }
            return a.place - b.place;
          });'''
          new = '''  return battleState.fighters.slice().sort(function(a,b){
            if(a.alive !== b.alive) return a.alive ? -1 : 1;
            if(a.alive && b.alive) {
              if(a.hp !== b.hp) return b.hp - a.hp;
              return b.eliminations - a.eliminations;
            }
            return a.place - b.place;
          });'''
          if old not in s:
              raise SystemExit('Expected leaderboard sort block not found')
          p.write_text(s.replace(old, new, 1))
          Path('.github/workflows/leader-energy-fix.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/leader-energy-fix.yml
          git commit -m "Rank live battle leader by energy"
          git push
