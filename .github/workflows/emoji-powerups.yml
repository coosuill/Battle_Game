name: Inspect battle pickup renderer

on:
  push:
    paths:
      - '.github/workflows/emoji-powerups.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show pickup drawing code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['battleState.pickups.forEach','pickups.forEach','fillText("+"','fillText("»"','fillText("S"','fillText("B"','fillText("R"','fillText("!"']
          seen=[]
          for needle in needles:
              start=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  if not any(abs(i-x)<900 for x in seen):
                      seen.append(i)
                      a=max(0,i-900); b=min(len(s),i+1900)
                      print('\n===== '+needle+' @ '+str(i)+' =====\n')
                      print(s[a:b].replace('\n',' '))
                  start=i+1
          # Also show functions whose source contains both pickup and fillText.
          for m in re.finditer(r'function\s+([A-Za-z0-9_$]+)\s*\([^)]*\)\s*\{',s):
              a=m.start(); nxt=s.find('\nfunction ',m.end())
              if nxt<0: nxt=min(len(s),a+12000)
              block=s[a:nxt]
              if 'pickup' in block.lower() and 'fillText' in block and len(block)<12000:
                  print('\n===== FUNCTION '+m.group(1)+' =====\n')
                  print(block[:10000].replace('\n',' '))
          PY
