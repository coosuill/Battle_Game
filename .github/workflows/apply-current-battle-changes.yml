name: Apply current Battle Game changes

on:
  push:
    paths:
      - '.github/workflows/apply-current-battle-changes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested changes
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          node --check /tmp/battle-check.js
      - name: Commit and clean helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-current-battle-changes.yml
          git add index.html .github/workflows/apply-current-battle-changes.yml
          git commit -m "Use emoji pickups and tune bazooka"
          git push
