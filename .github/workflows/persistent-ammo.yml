name: Make powerup ammo persistent

on:
  push:
    paths:
      - '.github/workflows/persistent-ammo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply persistent ammo mechanics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          before = s

          replacements = [
            ('if(f.bulletBoost > 0.2) return "💥";', 'if(f.bulletBoost > 0) return "💥";'),
            ('if(owner.bulletBoost > 0.2){\n    launchProjectileAtAngle(owner, angle - 0.13, speed, owner.damage * 0.82);\n    launchProjectileAtAngle(owner, angle, speed + 3, owner.damage);\n    launchProjectileAtAngle(owner, angle + 0.13, speed, owner.damage * 0.82);\n  } else {', 'if(owner.bulletBoost > 0){\n    launchProjectileAtAngle(owner, angle - 0.13, speed, owner.damage * 0.82);\n    launchProjectileAtAngle(owner, angle, speed + 3, owner.damage);\n    launchProjectileAtAngle(owner, angle + 0.13, speed, owner.damage * 0.82);\n    owner.bulletBoost = Math.max(0, owner.bulletBoost - 1);\n  } else {'),
            ('f.bulletBoost = Math.max(f.bulletBoost, 6.0);', 'f.bulletBoost = 4;'),
            ('    f.bulletBoost = Math.max(0, f.bulletBoost - dt);\n', ''),
            ('(pickupInfo.pickup.kind==="burst" && f.bulletBoost < 0.25)', '(pickupInfo.pickup.kind==="burst" && f.bulletBoost <= 0)'),
            ('f.attackLeft = (f.bulletBoost > 0.2 ? f.cooldown * 0.68 : f.cooldown) * rand(1.05, 1.40);', 'f.attackLeft = (f.bulletBoost > 0 ? f.cooldown * 0.68 : f.cooldown) * rand(1.05, 1.40);'),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Expected source not found: ' + old[:80])
              s = s.replace(old, new, 1)

          # moodText contains another burst check; change that occurrence too.
          old = 'if(f.bulletBoost > 0.2) return "💥";'
          if old not in s:
              raise SystemExit('Second burst status check not found')
          s = s.replace(old, 'if(f.bulletBoost > 0) return "💥";', 1)

          # Make the bazooka persistence explicit: it is ammo, not a timed buff.
          if 'f.bazookaShots += 1;' not in s:
              raise SystemExit('Bazooka pickup source not found')
          s = s.replace('f.bazookaShots += 1;', 'f.bazookaShots += 1; // persists until fired', 1)

          if s == before:
              raise SystemExit('No changes made')

          assert 'f.bulletBoost = 4;' in s
          assert 'owner.bulletBoost = Math.max(0, owner.bulletBoost - 1);' in s
          assert 'f.bulletBoost = Math.max(0, f.bulletBoost - dt);' not in s
          assert 'f.bazookaShots += 1; // persists until fired' in s

          p.write_text(s, encoding='utf-8')
          PY
          sed -n '/<script>/,/<\/script>/p' index.html | sed '1d;$d' > /tmp/battle.js
          node --check /tmp/battle.js
      - name: Commit and clean helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/persistent-ammo.yml
          git add index.html .github/workflows/persistent-ammo.yml
          git commit -m "Make burst and bazooka ammo persistent"
          git push
