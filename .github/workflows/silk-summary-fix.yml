name: Fix Silk battle summary scrolling

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make summary scrollable in Silk
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); old='.celebrate{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);z-index:20}\\n.celebrate.show{display:grid}\\n.celebrate-card{\\n  width:min(96vw,1100px);\\n  max-height:90vh;\\n  padding:16px;\\n  text-align:center;\\n  overflow:auto;\\n}'; new='.celebrate{\\n  position:fixed;inset:0;display:none;\\n  align-items:flex-start;justify-items:center;\\n  background:rgba(0,0,0,.45);backdrop-filter:blur(3px);z-index:20;\\n  overflow-y:auto;-webkit-overflow-scrolling:touch;\\n  padding:12px 6px 28px;\\n}\\n.celebrate.show{display:grid}\\n.celebrate-card{\\n  width:min(96vw,1100px);\\n  max-height:none;\\n  padding:16px 16px 76px;\\n  text-align:center;\\n  overflow:visible;\\n  margin:auto 0;\\n}\\n#celeClose{\\n  position:fixed;\\n  top:12px;\\n  right:12px;\\n  z-index:30;\\n  margin:0 !important;\\n  padding:10px 14px;\\n  box-shadow:0 3px 12px rgba(0,0,0,.35);\\n}'; assert old in s, 'Expected celebration CSS block not found'; p.write_text(s.replace(old,new,1)); Path('.github/workflows/silk-summary-fix.yml').unlink()"
      - name: Commit Silk summary fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/silk-summary-fix.yml
          git commit -m "Fix battle summary scrolling in Silk browser"
          git push
